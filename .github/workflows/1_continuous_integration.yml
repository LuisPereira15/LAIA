name: 1 - Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test-unit:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: [self-hosted, linux, x64, training]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show runner information
        run: |
          echo "Runner is working"
          echo "Hostname: $(hostname)"
          echo "Architecture: $(uname -m)"
          echo "Current directory: $(pwd)"

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Run unit tests
        run: |
          docker compose run --rm \
            --user "$(id -u):$(id -g)" \
            dev python -m pytest \
              tests/test_train.py \
              tests/test_api.py \
              -v \
              -p no:cacheprovider

  build-images:
    needs: test-unit

    runs-on: [self-hosted, linux, x64, training]

    permissions:
      contents: read
      packages: write

    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REGISTRY: ghcr.io
      TRAINING_IMAGE: ghcr.io/luispereira15/laia-training
      SERVING_IMAGE: ghcr.io/luispereira15/laia-serving

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show image tag
        run: |
          echo "Building Docker images for commit: $COMMIT_SHA"

      - name: Build training image
        run: |
          docker build \
            -f infra/training/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/LuisPereira15/LAIA" \
            -t $TRAINING_IMAGE:$COMMIT_SHA \
            .

      - name: Build serving image
        run: |
          docker build \
            -f infra/vm1-api/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/LuisPereira15/LAIA" \
            -t $SERVING_IMAGE:$COMMIT_SHA \
            .

      - name: Show built images
        run: |
          docker image inspect $TRAINING_IMAGE:$COMMIT_SHA > /dev/null
          docker image inspect $SERVING_IMAGE:$COMMIT_SHA > /dev/null

          echo "Training image built successfully:"
          docker image ls $TRAINING_IMAGE:$COMMIT_SHA

          echo "Serving image built successfully:"
          docker image ls $SERVING_IMAGE:$COMMIT_SHA

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $TRAINING_IMAGE:$COMMIT_SHA
          docker push $SERVING_IMAGE:$COMMIT_SHA