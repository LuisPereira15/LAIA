name: Container integration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GIT_COMMIT: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: laia-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test training, serving, tracking and persistence
        run: sh scripts/check-demo.sh
      - name: Container diagnostics
        if: failure()
        run: docker compose -f docker-compose.yml -f compose.demo.yml logs --no-color --tail 100
      - name: Stop this job's containers
        if: always()
        run: docker compose -f docker-compose.yml -f compose.demo.yml down
