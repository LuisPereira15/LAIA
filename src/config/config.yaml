# Sampling preserves observed class proportions. Use null for a full validation/test set.

mlflow:
  tracking_uri: http://localhost:5050
  experiment_name: flight-delay-severity
  model_name: flight-delay-classifier
data:
  processed_path: src/data/processed/cleaned_flights_data.csv
  sample_size: 500000
  test_year: 2023
  train_year: 2022
  random_seed: 42
  validation_start_month: 10
  validation_sample_size: 200000
  test_sample_size: 500000
  chunksize: 200000
features:
  bts_to_eda_mapping:
    OP_CARRIER_AIRLINE_ID: AIRLINE_ID
    ORIGIN: ORIGIN_AIRPORT
    ORIGIN_STATE_ABR: ORIGIN_STATE
    DEST: DEST_AIRPORT
    DEST_STATE_ABR: DEST_STATE
    CRS_DEP_TIME: DEPARTURE_TIME
    CRS_ARR_TIME: ARRIVAL_TIME
    YEAR: YEAR
    MONTH: MONTH
    DAY_OF_WEEK: DAY_OF_WEEK
    DISTANCE: DISTANCE
  categorical:
  - AIRLINE_ID
  - ORIGIN_AIRPORT
  - ORIGIN_STATE
  - DEST_AIRPORT
  - DEST_STATE
  numeric:
  - DISTANCE
  temporal:
  - MONTH
  - DAY_OF_WEEK
  time_hhmm:
  - DEPARTURE_TIME
  - ARRIVAL_TIME
  target: ARR_DELAY_CATEGORY
  target_classes:
  - on_time
  - moderate_delay
  - severe_delay
models:
  random_forest:
    type: RandomForestClassifier
    param_grid:
      n_estimators:
      - 50
      - 100
      max_depth:
      - 15
      min_samples_split:
      - 5
      class_weight:
      - null
      - balanced
      n_jobs:
      - -1
  logistic_regression:
    type: LogisticRegression
    param_grid:
      C:
      - 0.1
      - 1.0
      max_iter:
      - 500
      solver:
      - saga
      class_weight:
      - balanced
training:
  enabled_models:
  - random_forest
  - logistic_regression
  primary_metric: f1_macro
  output_dir: artifacts/training
  refit_on_full_train_year: true
  minimum_improvement_over_dummy: 0.0
